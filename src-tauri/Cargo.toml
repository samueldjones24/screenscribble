[package]
name = "screenscribble"
version = "0.1.0"
edition = "2021"
description = "Transient desktop annotation overlay for demos, meetings, and screenshots."
license = "MIT"
repository = "https://github.com/screenscribble/screenscribble"
homepage = "https://screenscribble.app"
authors = ["ScreenScribble"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
webbrowser = "1"
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
